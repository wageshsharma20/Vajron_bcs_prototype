# mavlink-router configuration for the Vajron GCS Pi.
# Installed to /etc/vajron-gcs/mavlink-router.conf by install-on-pi.sh, which
# fills in the flight-controller device and baud rate.
#
# One router owns the link to the aircraft and fans it out, so every ground
# station is an independent peer. Before this, QGroundControl sat in the middle
# and forwarded to the bridge: closing QGC took the DDA GCS down with it.
#
#   Pixhawk --UART--> router --UDP 14551--> bridge   (telemetry)
#                       ^ <---UDP 14560---- bridge   (commands; ACKs return)
#                       +-----TCP 5760----> QGroundControl
#
# The router routes by MAVLink target system, so a COMMAND_ACK addressed to
# the bridge (system 254) goes back to the bridge, and one addressed to QGC
# (system 255) goes back to QGC. That only works because the two no longer
# share an identity.

[General]
# QGroundControl connects here: Application Settings > Comm Links > Add >
# Type TCP, host <this Pi>, port 5760. TCP rather than UDP so the laptop
# needs no fixed address -- whoever connects gets the stream.
TcpServerPort = 5760
ReportStats = false
MavlinkDialect = auto

[UartEndpoint autopilot]
Device = VAJRON_FC_DEVICE
Baud = VAJRON_FC_BAUD

# Telemetry into the bridge. The bridge listens on this port; the router sends.
[UdpEndpoint bridge_telemetry]
Mode = Normal
Address = 127.0.0.1
Port = 14551

# Commands out of the bridge. The router listens here and learns the bridge's
# address from the first command, which is also where it sends the ACKs.
[UdpEndpoint bridge_commands]
Mode = Server
Address = 127.0.0.1
Port = 14560
