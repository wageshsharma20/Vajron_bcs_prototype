# Triggerhappy config for the Vajron GCS panic key.
# Installed to /etc/triggerhappy/triggers.d/vajron-gcs.conf
#
# Format:  <key combination>  <value>  <command>
#          value 1 = key pressed, 0 = released, 2 = auto-repeat
#
# Ctrl + Alt + Shift + Q. Four keys, chosen so it cannot be struck by accident
# mid-flight, and so it does not collide with anything Chromium or the
# compositor already uses.
KEY_LEFTCTRL+KEY_LEFTALT+KEY_LEFTSHIFT+KEY_Q 1 /usr/local/bin/vajron-panic

# The right-hand modifiers are a separate physical combination as far as the
# kernel is concerned, so they need their own line or the key only works on the
# left of the keyboard.
KEY_RIGHTCTRL+KEY_RIGHTALT+KEY_RIGHTSHIFT+KEY_Q 1 /usr/local/bin/vajron-panic
KEY_LEFTCTRL+KEY_LEFTALT+KEY_RIGHTSHIFT+KEY_Q 1 /usr/local/bin/vajron-panic
